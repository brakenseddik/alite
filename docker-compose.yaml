services:
  db:
    image: postgres:16.4  # pinned, not "latest" (see D-002)
    container_name: postgres-container
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?DB name is a required field}
      POSTGRES_USER: ${POSTGRES_USER?DB user is a required field}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?DB password is a required field}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"  # bound to localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data  # data survives container removal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: postgres:16.4
    env_file: .env
    command: [ "sh", "-c", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h db -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT now()'" ]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: